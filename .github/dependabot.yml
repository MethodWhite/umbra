version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    ignore:
      - dependency-name: "synapsis"
      - dependency-name: "pqc-crypto"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
