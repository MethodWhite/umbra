name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      run: rustup update stable && rustup default stable
    - name: Cache Cargo dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libwebkitgtk-6.0-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libsqlcipher-dev
    - name: Check desktop
      run: cargo check --release --bin umbra-gui

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      run: rustup update stable && rustup default stable
    - name: Cache Cargo dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libwebkitgtk-6.0-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libsqlcipher-dev libxdo-dev
    - name: Run tests
      run: cargo test --lib
    - name: Run synapsis-core tests
      run: cargo test --lib -p synapsis-core

  build-server:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      run: rustup update stable && rustup default stable
    - name: Cache Cargo dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-server-${{ hashFiles('**/Cargo.lock') }}
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libsqlcipher-dev
    - name: Build server
      run: cargo build --release --bin umbra --features server

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      run: rustup update stable && rustup default stable
    - name: Cache Cargo dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-deny-${{ hashFiles('**/Cargo.lock') }}
    - name: Install cargo-deny
      run: cargo install cargo-deny --locked
    - name: Run cargo deny
      run: cargo deny check
