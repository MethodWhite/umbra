# cargo-deny configuration for Umbra
# Run: cargo deny check

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "workspace"
unsound = "transitive"
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "BUSL-1.1",
    "0BSD",
    "Unlicense",
    "OFL-1.1",
    "MIT-0",
    "NCSA",
    "CDLA-Permissive-2.0",
    "LicenseRef-UFL-1.0",
    "LGPL-2.1-or-later",
]
exceptions = [
    { name = "self_cell", allow = ["GPL-2.0-only"] },
]
private = { ignore = true }

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/MethodWhite/paste"]
