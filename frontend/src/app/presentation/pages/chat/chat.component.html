<app-hud [state]="hudState" [audioData]="audioData"></app-hud>

<div class="hud-overlay">

  <div class="hud-topbar">
    <div class="hud-logo">☰ UMBRA</div>
    <div class="hud-status">
      <span class="status-dot" [class.active]="isListening"></span>
      <span class="status-text">{{ statusText || 'STANDBY' }}</span>
    </div>
    <div class="hud-clock">{{ currentTime | date:'HH:mm:ss' }}</div>
  </div>

  <div class="hud-models">
    <div class="model-badge primary" *ngIf="primaryModel">
      <span class="label">PRI</span>
      <span class="name">{{ primaryModel }}</span>
    </div>
    <div class="model-badge secondary" *ngIf="secondaryModel">
      <span class="label">SEC</span>
      <span class="name">{{ secondaryModel }}</span>
    </div>
  </div>

  <div class="hud-agents">
    <div class="agent-indicator" *ngFor="let agent of activeAgents">
      <div class="agent-ring" [class.working]="agent.active"></div>
      <span class="agent-name">{{ agent.name }}</span>
    </div>
  </div>

  <div class="hud-center">
    <div class="command-ring" [class.pulse]="isListening || hudState === 'agent-thinking'">
      <div class="inner-ring"></div>
      <div class="ring-arc" *ngFor="let _ of [].constructor(12); let i = index"
           [style.transform]="'rotate(' + (i * 30) + 'deg)'"></div>
    </div>
    <div class="command-text" *ngIf="transcript">{{ transcript }}</div>
  </div>

  <div class="hud-terminal" *ngIf="messages.length > 0">
    <div class="terminal-header">► SYSTEM.LOG</div>
    <div class="terminal-messages" #messageLog>
      <div class="msg-line" *ngFor="let msg of messages" [class.user]="msg.from === 'user'">
        <span class="prefix">{{ msg.from === 'user' ? '>' : '▸' }}</span>
        <span class="content">{{ msg.text }}</span>
        <span class="timestamp">{{ msg.timestamp | date:'HH:mm:ss' }}</span>
      </div>
    </div>
  </div>

  <div class="hud-controls">
    <button class="hud-btn" (click)="toggleMute()" [class.active]="!isMuted" [class.muted]="isMuted">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
      </svg>
    </button>
    <button class="hud-btn" (click)="openSettings()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <button class="hud-btn" (click)="toggleMenu()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/>
      </svg>
    </button>
  </div>

  <div class="hud-menu" *ngIf="menuOpen">
    <button (click)="navigateTo('/settings')">▸ SETTINGS</button>
    <button (click)="restartServer()">▸ RESTART</button>
    <button (click)="fixSelf()">▸ DIAGNOSE</button>
  </div>

</div>
