<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="orb" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#7c3aed" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f0c29" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crescent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="umbrella" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="circleClip">
      <circle cx="256" cy="220" r="120"/>
    </clipPath>
  </defs>

  <!-- Dark background -->
  <rect width="512" height="512" fill="#0f0c29"/>

  <!-- Grid lines -->
  <g stroke="#1e1b4b" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="64" x2="512" y2="64"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="192" x2="512" y2="192"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="0" y1="448" x2="512" y2="448"/>
    <line x1="64" y1="0" x2="64" y2="512"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="192" y1="0" x2="192" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="320" y1="0" x2="320" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="448" y1="0" x2="448" y2="512"/>
  </g>

  <!-- Outer glow -->
  <circle cx="256" cy="220" r="180" fill="url(#glow)"/>

  <!-- Main orb -->
  <circle cx="256" cy="220" r="120" fill="url(#orb)" filter="url(#softGlow)"/>

  <!-- Crescent shadow (umbra) - a dark crescent overlaid on the orb -->
  <g clip-path="url(#circleClip)">
    <circle cx="300" cy="190" r="95" fill="#0f0c29" opacity="0.85"/>
    <circle cx="310" cy="185" r="80" fill="#0f0c29"/>
  </g>

  <!-- Crescent edge highlight -->
  <path d="M 220 120 A 120 120 0 0 0 220 320 A 95 95 0 0 1 230 130 Z" fill="url(#crescent)" opacity="0.6"/>

  <!-- Small accent dots -->
  <circle cx="180" cy="160" r="2" fill="#a78bfa" opacity="0.8"/>
  <circle cx="165" cy="200" r="1.5" fill="#c084fc" opacity="0.6"/>
  <circle cx="340" cy="140" r="1.5" fill="#818cf8" opacity="0.5"/>
  <circle cx="350" cy="270" r="1" fill="#a78bfa" opacity="0.4"/>
  <circle cx="155" cy="280" r="1" fill="#c084fc" opacity="0.3"/>

  <!-- UMBRA text -->
  <text x="256" y="400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" fill="#e0e0e0" text-anchor="middle" letter-spacing="12" filter="url(#softGlow)">
    UMBRA
  </text>

  <!-- Subtitle -->
  <text x="256" y="440" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="300" fill="#7c3aed" text-anchor="middle" letter-spacing="8" opacity="0.7">
    SHADOW PLATFORM
  </text>
</svg>
