<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <defs>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
    <marker id="arrowRightWhite" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94A3B8"/>
    </marker>
    <!-- Zone colors -->
    <linearGradient id="zone0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="zone1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="zone2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="zone3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="zone4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="zone5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="zone6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="#0F0F1A" rx="12"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">UMBRA Clean Architecture</text>
  <text x="450" y="60" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">Dependency Rule: Inner zones know nothing about outer zones</text>

  <!-- Legend -->
  <g transform="translate(620, 80)">
    <text x="0" y="0" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94A3B8" font-weight="600">Zones</text>
    <rect x="0" y="10" width="10" height="10" rx="2" fill="url(#zone0)"/>
    <text x="16" y="19" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#94A3B8">Zone 0 — Domain</text>
    <rect x="0" y="26" width="10" height="10" rx="2" fill="url(#zone1)"/>
    <text x="16" y="35" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#94A3B8">Zone 1 — Application</text>
    <rect x="0" y="42" width="10" height="10" rx="2" fill="url(#zone2)"/>
    <text x="16" y="51" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#94A3B8">Zone 2 — AI Client</text>
    <rect x="0" y="58" width="10" height="10" rx="2" fill="url(#zone3)"/>
    <text x="16" y="67" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#94A3B8">Zone 3 — Agent Memory</text>
    <rect x="0" y="74" width="10" height="10" rx="2" fill="url(#zone4)"/>
    <text x="16" y="83" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#94A3B8">Zone 4 — Providers</text>
    <rect x="0" y="90" width="10" height="10" rx="2" fill="url(#zone5)"/>
    <text x="16" y="99" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#94A3B8">Zone 5 — Infrastructure</text>
    <rect x="0" y="106" width="10" height="10" rx="2" fill="url(#zone6)"/>
    <text x="16" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#94A3B8">Zone 6 — UI / API / CLI</text>
  </g>

  <!-- Arrow key -->
  <g transform="translate(620, 210)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrowRight)"/>
    <text x="55" y="4" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B">Dependency</text>
  </g>

  <!-- Zone 0 — Domain Models & Ports (innermost) -->
  <g filter="url(#shadow)">
    <rect x="50" y="100" width="400" height="80" rx="8" fill="url(#zone0)" opacity="0.95"/>
    <text x="60" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">Zone 0 — Domain</text>
    <text x="60" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#C7D2FE">Models · Port Traits · Repository Interfaces</text>
    <text x="60" y="156" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#818CF8">TTS, STT, VoiceID, Security, Vault, Provider</text>
    <text x="60" y="170" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#818CF8">No external dependencies</text>
  </g>

  <!-- Arrow: Zone 0 → Zone 1 -->
  <line x1="250" y1="180" x2="250" y2="210" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrowRight)"/>

  <!-- Zone 1 — Application Use Cases -->
  <g filter="url(#shadow)">
    <rect x="50" y="215" width="400" height="80" rx="8" fill="url(#zone1)" opacity="0.95"/>
    <text x="60" y="237" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#E2F0F0">Zone 1 — Application</text>
    <text x="60" y="255" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#C7D2FE">Use Cases · Orchestration</text>
    <text x="60" y="271" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#818CF8">Voice · Vault · Security · Provider Registry</text>
    <text x="60" y="285" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#818CF8">Implements Domain port traits</text>
  </g>

  <!-- Arrow: Zone 1 → Zone 2 -->
  <line x1="250" y1="295" x2="250" y2="325" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrowRight)"/>

  <!-- Zone 2 — AI Client -->
  <g filter="url(#shadow)">
    <rect x="50" y="330" width="400" height="70" rx="8" fill="url(#zone2)" opacity="0.95"/>
    <text x="60" y="352" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#E2F0F0">Zone 2 — AI Client</text>
    <text x="60" y="370" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#C7D2FE">Ollama / llama.cpp HTTP Client</text>
    <text x="60" y="386" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#818CF8">Inference requests · Model management</text>
  </g>

  <!-- Arrow: Zone 2 → Zone 3 -->
  <line x1="250" y1="400" x2="250" y2="430" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrowRight)"/>

  <!-- Zone 3 — Agent Memory -->
  <g filter="url(#shadow)">
    <rect x="50" y="435" width="400" height="70" rx="8" fill="url(#zone3)" opacity="0.95"/>
    <text x="60" y="457" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#E2F0F0">Zone 3 — Agent Memory</text>
    <text x="60" y="475" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#C7D2FE">APM · Plutchik Emotions · CBT</text>
    <text x="60" y="491" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#818CF8">80+ emotional states · Gender/communication styles</text>
  </g>

  <!-- Arrow: Zone 3 → Zone 4 -->
  <line x1="250" y1="505" x2="250" y2="535" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrowRight)"/>

  <!-- Zone 4 — Providers -->
  <g filter="url(#shadow)">
    <rect x="500" y="100" width="350" height="70" rx="8" fill="url(#zone4)" opacity="0.95"/>
    <text x="510" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#E2F0F0">Zone 4 — Providers</text>
    <text x="510" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#C7D2FE">23 API Providers</text>
    <text x="510" y="156" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#818CF8">OpenAI · Anthropic · Google · DeepSeek · Qwen · Ollama · 18 more</text>
  </g>

  <!-- Arrow: Zone 4 → Zone 5 (left side) -->
  <line x1="500" y1="170" x2="460" y2="400" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowRight)"/>

  <!-- Zone 5 — Infrastructure -->
  <g filter="url(#shadow)">
    <rect x="500" y="195" width="350" height="70" rx="8" fill="url(#zone5)" opacity="0.95"/>
    <text x="510" y="217" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#E2F0F0">Zone 5 — Infrastructure</text>
    <text x="510" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#C7D2FE">Engine · Bridge · Jarvis · Ironclaw</text>
    <text x="510" y="253" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#818CF8">Server-only (--features server)</text>
  </g>

  <!-- Arrow: Zone 5 → Zone 6 -->
  <line x1="675" y1="265" x2="675" y2="320" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrowRight)"/>

  <!-- Zone 6 — UI / API / CLI -->
  <g filter="url(#shadow)">
    <rect x="500" y="325" width="350" height="70" rx="8" fill="url(#zone6)" opacity="0.95"/>
    <text x="510" y="347" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#E2F0F0">Zone 6 — UI / API / CLI</text>
    <text x="510" y="365" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#C7D2FE">egui Desktop · API Server · CLI</text>
    <text x="510" y="381" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#818CF8">HUD · Trading Panel · Conversations</text>
  </g>

  <!-- Side panels -->
  <!-- Audio Pipeline -->
  <g filter="url(#shadow)">
    <rect x="500" y="420" width="160" height="60" rx="6" fill="#1E1B4B" opacity="0.9"/>
    <text x="510" y="440" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#A78BFA">Audio Pipeline</text>
    <text x="510" y="456" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#818CF8">Mic capture · Playback · VAD</text>
    <text x="510" y="470" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#818CF8">TTS (espeak/Piper/Fish)</text>
  </g>

  <!-- Security -->
  <g filter="url(#shadow)">
    <rect x="690" y="420" width="160" height="60" rx="6" fill="#1E1B4B" opacity="0.9"/>
    <text x="700" y="440" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#A78BFA">Security Layer</text>
    <text x="700" y="456" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#818CF8">SSRF · Rate limiting · Audit</text>
    <text x="700" y="470" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#818CF8">AES-256-GCM vault</text>
  </g>

  <!-- External arrows to Audio/Security -->
  <line x1="580" y1="395" x2="580" y2="418" stroke="#64748B" stroke-width="1" marker-end="url(#arrowRight)"/>
  <line x1="770" y1="395" x2="770" y2="418" stroke="#64748B" stroke-width="1" marker-end="url(#arrowRight)"/>

  <!-- Footer -->
  <text x="450" y="520" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#475569">Dependency direction: Outer Zones depend on Inner Zones (via trait-based ports)</text>

  <!-- Right side integration labels -->
  <g transform="translate(500, 80)">
    <!-- already used -->
  </g>
</svg>
